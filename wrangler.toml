# Cloudflare Pages Projekt (Frontend aus ./dist + Functions aus ./functions)
name = "private-group-calendar"
compatibility_date = "2024-10-22"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"                       # verfügbar als env.DB in den Functions
database_name = "private-group-calendar"
# Nach `npm run db:create` die ausgegebene ID hier eintragen.
# Für die lokale Entwicklung (--local) funktioniert auch der Platzhalter.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
